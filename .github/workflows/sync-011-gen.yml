name: Sync 011/012 Genericos -> Siesa (diario 10:45pm)

# Flujo de clientes genericos (222222222222) por CO: 011 (caja Z01) y 012 (cajas Z01 y Z02).
# Los COs salen de GEN_COS (default 011,012) y corren en secuencia.
# Toma las genericas del dia, muestrea el 10% (determinista distribuido) y las procesa
# con la mecanica CNZ->CFZ (igual que el flujo normal). NO toca el flujo normal ni las
# estadisticas. Corre DENTRO del runner de GitHub Actions (node directo), no via Vercel.

on:
  schedule:
    # 10:45 pm hora Colombia (COT, UTC-5, sin horario de verano) = 03:45 UTC del dia siguiente.
    # Movido desde las 8:30pm (nov-2026) a pedido de inventarios: debe correr DESPUES de las
    # transformaciones (10pm) para que las facturas no pidan ajustes por inventario negativo.
    # Riesgo aceptado: a esta hora la tabla viva puede estar parcial o vacia (ver aviso abajo).
    # Se adelanto de 11pm a 10:45pm porque el 06, 09 y 10-nov-2026 el web service de Siesa
    # (wsmerkahorro.siesacloud.com) no respondio a las 11pm (timeout / conexion rechazada),
    # mientras que el Sync POS (~10:15-10:31pm) si entro. 10:45pm deja margen despues del
    # Sync POS para no cruzarse con el (ambos postean en el CO 011).
    #
    # ⚠️ DEBE correr ANTES del cierre del POS. Las queries leen las tablas VIVAS, que solo
    #    conservan el dia en curso: al cerrar el dia, el POS mueve todo a los acumulados y la
    #    tabla viva queda vacia. A las 10pm el flujo daba 0 facturas el 21 y 22-ago-2026
    #    (el 19-ago a las 10:17pm si funciono, ese dia el cierre fue mas tarde).
    #    Si vuelve a dar 0, hay que adelantar aun mas esta hora.
    # OJO: el cron de GitHub es en UTC y puede retrasarse varios minutos bajo carga, asi que
    #      la corrida real puede caer despues de las 8:30pm. Tenerlo en cuenta si el cierre
    #      del POS es cerca de las 9pm.
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      porcentaje:
        description: 'PRUEBA: porcentaje del muestreo (vacio = 10).'
        required: false
        default: ''
      fecha:
        description: 'PRUEBA: dia a procesar YYYY-MM-DD (vacio = hoy en Bogota).'
        required: false
        default: ''
      solo_cnz:
        description: 'PRUEBA: cortar en CNZ (no envia CFZ).'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      dry_run:
        description: 'PRUEBA: solo mostrar la muestra, NO enviar nada a Siesa.'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      entorno:
        description: 'Entorno de ESCRITURA de este flujo (default QA). PROD solo al salir a produccion.'
        required: false
        type: choice
        options: ['QA', 'PROD']
        default: 'QA'
      # --- REPROCESO MANUAL de facturas genericas puntuales (sin muestreo) ---
      fuente:
        description: 'Reproceso: fuente de datos. vivo = tablas del dia en curso; acumulado = dias anteriores (requiere documentos).'
        required: false
        type: choice
        options: ['vivo', 'acumulado']
        default: 'vivo'
      documentos:
        description: 'Reproceso: llaves CO-CAJA-CONSEC separadas por coma (ej. 011-Z01-123,012-Z02-45). Vacio = flujo normal (muestreo 10%).'
        required: false
        default: ''
      tipos:
        description: 'Reproceso: tipos a enviar (requiere documentos).'
        required: false
        type: choice
        options: ['ambas', 'CNZ', 'CFZ']
        default: 'ambas'
      fecha_docto:
        description: 'Reproceso: fecha de insercion en Siesa YYYY-MM-DD (vacio = fecha original; requiere documentos).'
        required: false
        default: ''

# Evita que dos corridas se solapen (no cancela la que esta en curso).
concurrency:
  group: sync-011-gen
  cancel-in-progress: false

jobs:
  sync-011-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 22 es REQUERIDO: @supabase/supabase-js necesita WebSocket nativo.
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar sincronizacion genericos (011, 012)
        run: node scripts/runSync011GenCron.js
        env:
          # COs genericos a procesar (separados por coma). Default: 011,012.
          GEN_COS: ${{ vars.GEN_COS || '011,012' }}
          # --- Credenciales / conexion (GitHub Secrets) ---
          CONNI_KEY: ${{ secrets.CONNI_KEY }}
          CONNI_TOKEN: ${{ secrets.CONNI_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # --- Configuracion del flujo ---
          CIA: ${{ secrets.CIA }}
          # Entorno de ESCRITURA de ESTE flujo, INDEPENDIENTE del flujo normal.
          # El cron diario escribe a Siesa PROD. El dispatch manual usa el input 'entorno'
          # (default QA) para poder correr pruebas sin tocar produccion. NO usa el secret
          # compartido ENTORNO_SIESA, asi que el flujo normal queda independiente.
          ENTORNO_SIESA_011: ${{ github.event.inputs.entorno || 'PROD' }}
          CONCURRENCIA: ${{ secrets.CONCURRENCIA }}
          PAGINACION_CONCURRENCIA: ${{ secrets.PAGINACION_CONCURRENCIA }}
          MAX_RONDAS_AJUSTE: ${{ secrets.MAX_RONDAS_AJUSTE }}
          # --- Parametros del muestreo (el cron los deja vacios = produccion: 10% de hoy) ---
          MUESTRA_PORCENTAJE_011: ${{ github.event.inputs.porcentaje || '' }}
          MUESTRA_FECHA_011: ${{ github.event.inputs.fecha || '' }}
          MUESTRA_SOLO_CNZ: ${{ github.event.inputs.solo_cnz || 'false' }}
          MUESTRA_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # --- Reproceso manual por documentos (el cron los deja vacios = flujo normal) ---
          FUENTE_GEN: ${{ github.event.inputs.fuente || 'vivo' }}
          DOCUMENTOS_GEN: ${{ github.event.inputs.documentos || '' }}
          TIPOS_GEN: ${{ github.event.inputs.tipos || 'ambas' }}
          FECHA_DOCTO_GEN: ${{ github.event.inputs.fecha_docto || '' }}
          # --- Notificaciones por correo (GitHub Secrets) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_ERROR_EMAILS: ${{ secrets.NOTIFY_ERROR_EMAILS }}
          NOTIFY_CPE_EMAILS: ${{ secrets.NOTIFY_CPE_EMAILS }}
