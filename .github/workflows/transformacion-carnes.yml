name: Transformaciones carnes (diario 10pm)

# Toma las unidades netas vendidas del item 15207 (CHICHARRON MERKAHORRO) del dia y registra
# en Siesa la ENTRADA de chicharron (CEI) y la SALIDA de tocino 15202 (CSA) por CO/bodega.
# Corre DENTRO del runner de GitHub Actions (node directo), no via Vercel.

on:
  schedule:
    # 10:00 pm hora Colombia (COT, UTC-5, sin horario de verano) = 03:00 UTC del dia siguiente.
    # Lee tablas vivas (dia en curso) y de acumulados (ultimos 3 dias), por eso no depende
    # del cierre del POS. El cron de GitHub puede retrasarse unos minutos bajo carga.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Dia a procesar YYYY-MM-DD (vacio = hoy en Bogota; el dia en curso solo se procesa desde las 21:30 COT).'
        required: false
        default: ''
      dry_run:
        description: 'PRUEBA: no envia a Siesa ni escribe en Supabase, solo muestra totales y payloads.'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      entorno:
        description: 'Entorno de ESCRITURA de este flujo (default QA). PROD solo para el cron o para reprocesar un dia real.'
        required: false
        type: choice
        options: ['QA', 'PROD']
        default: 'QA'
      solo_negativos:
        description: 'Corre SOLO el job de negativos (sin tocino) y permite procesar el dia en curso antes de las 21:30 COT. Usar solo con cierre anticipado de tiendas.'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      cierre_anticipado:
        description: 'Cierre anticipado: procesa el dia en curso antes de las 21:30 COT (tocino y negativos). Usar SOLO con todas las tiendas ya cerradas: ventas posteriores no se transforman despues.'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      cos:
        description: 'CO(s) a procesar en negativos (ej. 005 o 001,005). Vacio = todas.'
        required: false
        default: ''

# Evita que dos corridas se solapen (no cancela la que esta en curso).
concurrency:
  group: transformacion-carnes
  cancel-in-progress: false

jobs:
  transformacion-carnes:
    # En un dispatch manual con solo_negativos=true se omite el tocino. El cron (schedule) siempre lo corre.
    if: github.event_name == 'schedule' || github.event.inputs.solo_negativos != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 22 es REQUERIDO: @supabase/supabase-js necesita WebSocket nativo.
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Dia objetivo:
      #  - schedule: fecha de Bogota de hace 4 horas. A las 22:00 COT da el dia en curso; si GitHub
      #    retrasa la corrida hasta 4h (pasada la medianoche) sigue cayendo en el dia correcto.
      #  - workflow_dispatch: el input `fecha` tal cual (puede ir vacio = el codigo usa hoy en Bogota).
      - name: Calcular fecha objetivo
        id: fecha
        env:
          EVENTO: ${{ github.event_name }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          if [ "$EVENTO" = "schedule" ]; then
            FECHA=$(TZ=America/Bogota date -d '4 hours ago' +%F)
          else
            FECHA="$FECHA_INPUT"
          fi
          echo "Fecha objetivo: '${FECHA}'"
          echo "fecha=${FECHA}" >> "$GITHUB_OUTPUT"

      - name: Ejecutar transformacion tocino -> chicharron
        run: node scripts/runTransformacionCron.js
        env:
          # --- Credenciales / conexion (GitHub Secrets) ---
          CONNI_KEY: ${{ secrets.CONNI_KEY }}
          CONNI_TOKEN: ${{ secrets.CONNI_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CIA: ${{ secrets.CIA }}
          # --- Configuracion del flujo ---
          # Entorno de ESCRITURA de ESTE flujo, independiente de los demas.
          # El cron escribe a Siesa PROD. El dispatch manual usa el input 'entorno' (default QA)
          # para poder probar sin tocar produccion.
          ENTORNO_SIESA_TRANSF: ${{ github.event.inputs.entorno || 'PROD' }}
          TRANSF_FECHA: ${{ steps.fecha.outputs.fecha }}
          TRANSF_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Solo true en dispatch manual con cierre_anticipado=true: omite la guardia de las 21:30 COT.
          TRANSF_PERMITIR_DIA_EN_CURSO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cierre_anticipado == 'true' && 'true' || 'false' }}
          # Opcional: JSON con el mapa de transformaciones (vacio = default en codigo).
          TRANSF_MAPA: ${{ vars.TRANSF_MAPA || '' }}
          # --- Notificaciones por correo (GitHub Secrets) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TRANSF_EMAILS: ${{ secrets.NOTIFY_TRANSF_EMAILS }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}

  # Segundo job: limpia el inventario negativo de destinos (CEI + CSA por origen).
  # Corre DESPUES del job de tocino (needs): si tocino falla o se omite este job se omite tambien,
  # salvo en un dispatch manual con solo_negativos=true (tocino omitido a proposito).
  transformacion-negativos:
    needs: transformacion-carnes
    # Pausado: solo corre si la variable del repo TRANSF_NEG_HABILITADO vale 'true'
    # (Settings > Secrets and variables > Actions > Variables). Sin ella el job se omite.
    # !cancelled() evita el auto-skip por dependencia omitida; el resultado de tocino se valida a mano.
    if: ${{ !cancelled() && vars.TRANSF_NEG_HABILITADO == 'true' && (needs.transformacion-carnes.result == 'success' || (needs.transformacion-carnes.result == 'skipped' && github.event_name == 'workflow_dispatch' && github.event.inputs.solo_negativos == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Grupo propio: nunca cancela una corrida en curso (puede haber documentos en vuelo hacia Siesa).
    concurrency:
      group: transformacion-negativos
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Misma regla de fecha objetivo que el job de tocino (inputs compartidos).
      - name: Calcular fecha objetivo
        id: fecha
        env:
          EVENTO: ${{ github.event_name }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          if [ "$EVENTO" = "schedule" ]; then
            FECHA=$(TZ=America/Bogota date -d '4 hours ago' +%F)
          else
            FECHA="$FECHA_INPUT"
          fi
          echo "Fecha objetivo: '${FECHA}'"
          echo "fecha=${FECHA}" >> "$GITHUB_OUTPUT"

      - name: Ejecutar transformacion de inventario negativo
        run: node scripts/runTransformacionNegativosCron.js
        env:
          # --- Credenciales / conexion (GitHub Secrets) ---
          CONNI_KEY: ${{ secrets.CONNI_KEY }}
          CONNI_TOKEN: ${{ secrets.CONNI_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CIA: ${{ secrets.CIA }}
          # --- Configuracion del flujo (mismos inputs que el job de tocino) ---
          ENTORNO_SIESA_TRANSF: ${{ github.event.inputs.entorno || 'PROD' }}
          TRANSF_FECHA: ${{ steps.fecha.outputs.fecha }}
          TRANSF_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # --- Especificas de negativos (vacio = default en codigo) ---
          TRANSF_NEG_QUERY_INVENTARIO: ${{ vars.TRANSF_NEG_QUERY_INVENTARIO || 'merkahorro_items_inventario_costo_dev_transformaciones' }}
          TRANSF_NEG_COLUMNAS: ${{ vars.TRANSF_NEG_COLUMNAS || '' }}
          TRANSF_NEG_ITEMS_EXCLUIDOS: ${{ vars.TRANSF_NEG_ITEMS_EXCLUIDOS || '' }}
          TRANSF_NEG_DIAS_REANUDAR: ${{ vars.TRANSF_NEG_DIAS_REANUDAR || '' }}
          TRANSF_NEG_UNIDAD_NEGOCIO: ${{ vars.TRANSF_NEG_UNIDAD_NEGOCIO || '' }}
          # Filtro de CO (solo dispatch manual): primer envio limitado. Vacio = todas las tiendas. El cron (schedule) siempre va vacio.
          TRANSF_NEG_COS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cos || '' }}
          # Solo true en dispatch manual con solo_negativos=true o cierre_anticipado=true: omite la guardia
          # de las 21:30 COT (cierre anticipado).
          TRANSF_NEG_PERMITIR_DIA_EN_CURSO: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.solo_negativos == 'true' || github.event.inputs.cierre_anticipado == 'true') && 'true' || 'false' }}
          # --- Notificaciones por correo (GitHub Secrets) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TRANSF_NEG_EMAILS: ${{ secrets.NOTIFY_TRANSF_NEG_EMAILS }}
          NOTIFY_TRANSF_EMAILS: ${{ secrets.NOTIFY_TRANSF_EMAILS }}
          NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}
