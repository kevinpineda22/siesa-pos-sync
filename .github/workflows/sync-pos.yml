name: Sync POS -> Siesa (diario, tras transformaciones)

# Ejecuta el flujo CNZ->CFZ para el CO/Caja configurados. Corre DENTRO del runner de GitHub
# Actions (node directo), no vía Vercel, para no chocar con el límite de ejecución serverless.
#
# Corre UNA vez por noche, apenas termina el workflow de transformaciones (10pm COT).
# Solo se encadena si esas transformaciones vinieron del cron y terminaron en success:
#  - una corrida manual de transformaciones (pruebas en QA) NO dispara este sync de PROD.
#  - si las transformaciones fallan, esa noche no corre el sync.

on:
  workflow_run:
    # Debe coincidir EXACTO con el `name:` de transformacion-carnes.yml.
    workflows: ['Transformaciones carnes (diario 10pm)']
    types: [completed]
  workflow_dispatch:
    inputs:
      co:
        description: 'CO(s) a sincronizar (ej. 001 o 001,003). Vacío = usa el default.'
        required: false
        default: ''
      caja:
        description: 'Caja(s)/tipo docto (ej. P05 o P01,P03,P05). Vacío = usa el default.'
        required: false
        default: ''
      limite:
        description: 'PRUEBA: procesar solo N facturas (vacío = todas las del día).'
        required: false
        default: ''
      solo_hoy:
        description: 'Filtrar solo facturas de HOY (en pruebas pon false si hoy no hay).'
        required: false
        type: choice
        options: ['true', 'false']
        default: 'true'
      fuente:
        description: 'Fuente de ventas: vivo = tablas vivas (normal); acumulado = reproceso desde los últimos 7 días (exige documentos o fecha).'
        required: false
        type: choice
        options: ['vivo', 'acumulado']
        default: 'vivo'
      documentos:
        description: 'Reproceso: documentos CO-CAJA-CONSEC separados por coma (ej. 001-Z02-36298,003-Z01-11694). Vacío = no filtra por documento.'
        required: false
        default: ''
      fecha:
        description: 'Reproceso: fecha a reprocesar en formato YYYY-MM-DD. Vacío = no filtra por fecha.'
        required: false
        default: ''

# Evita que dos corridas se solapen (no cancela la que está en curso).
concurrency:
  group: sync-pos
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # Una sola corrida procesa todo el día (antes eran corridas incrementales cada hora).
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node >= 22 es REQUERIDO: @supabase/supabase-js necesita WebSocket nativo
          # (Node 20 crashea con "Node.js 20 detected without native WebSocket support").
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar sincronización
        run: node scripts/runSyncCron.js
        env:
          # --- Credenciales / conexión (GitHub Secrets) ---
          CONNI_KEY: ${{ secrets.CONNI_KEY }}
          CONNI_TOKEN: ${{ secrets.CONNI_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # --- Configuración del flujo ---
          CIA: ${{ secrets.CIA }}
          ENTORNO_SIESA: ${{ secrets.ENTORNO_SIESA }}
          CONCURRENCIA: ${{ secrets.CONCURRENCIA }}
          PAGINACION_CONCURRENCIA: ${{ secrets.PAGINACION_CONCURRENCIA }}
          MAX_RONDAS_AJUSTE: ${{ secrets.MAX_RONDAS_AJUSTE }}
          # --- Filtros CO/Caja: input manual del dispatch tiene prioridad; si no, default ---
          CO_FILTER: ${{ github.event.inputs.co || '001,011,003,007' }}
          CAJA_FILTER: ${{ github.event.inputs.caja || 'Z01,Z02' }}
          # --- Modo prueba (solo aplica en "Run workflow"; la corrida automática los deja vacíos = producción) ---
          CRON_LIMITE: ${{ github.event.inputs.limite || '' }}
          # La corrida automática NO filtra por "hoy": si GitHub la retrasa pasada la medianoche,
          # "hoy" ya sería el día siguiente y se saltaría todo el día. Procesa la ventana de
          # Connekta (~2 días); la idempotencia omite las OK y así se reintentan los FALLO de ayer.
          CRON_SOLO_HOY: ${{ github.event_name == 'workflow_run' && 'false' || github.event.inputs.solo_hoy || 'true' }}
          # --- Reproceso manual (solo aplica en "Run workflow"; la corrida automática los deja en vivo/vacío) ---
          FUENTE_VENTAS: ${{ github.event.inputs.fuente || 'vivo' }}
          DOCUMENTOS: ${{ github.event.inputs.documentos || '' }}
          FECHA_REPROCESO: ${{ github.event.inputs.fecha || '' }}
          # --- Notificaciones por correo (GitHub Secrets) ---
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_ERROR_EMAILS: ${{ secrets.NOTIFY_ERROR_EMAILS }}
          NOTIFY_CPE_EMAILS: ${{ secrets.NOTIFY_CPE_EMAILS }}
